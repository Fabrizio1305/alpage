<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2f5d3a">
  <title>Alpage</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <svg class="symboles" aria-hidden="true">
    <symbol id="marmotte" viewBox="0 0 64 64">
      <ellipse cx="32" cy="43" rx="20" ry="16" fill="#8a5a2b"/>
      <ellipse cx="32" cy="47" rx="11" ry="9" fill="#c9a071"/>
      <circle cx="20" cy="14" r="5.5" fill="#8a5a2b"/><circle cx="44" cy="14" r="5.5" fill="#8a5a2b"/>
      <circle cx="20" cy="14" r="2.5" fill="#c9a071"/><circle cx="44" cy="14" r="2.5" fill="#c9a071"/>
      <circle cx="32" cy="25" r="15" fill="#8a5a2b"/>
      <ellipse cx="32" cy="31" rx="8" ry="6" fill="#c9a071"/>
      <circle cx="26" cy="23" r="2.3" fill="#1f1a14"/><circle cx="38" cy="23" r="2.3" fill="#1f1a14"/>
      <ellipse cx="32" cy="29" rx="2.6" ry="1.8" fill="#1f1a14"/>
      <rect x="29.4" y="31" width="2.3" height="4.5" rx="0.7" fill="#fff"/><rect x="32.3" y="31" width="2.3" height="4.5" rx="0.7" fill="#fff"/>
    </symbol>
    <symbol id="bouclier" viewBox="0 0 24 24">
      <path d="M12 2 4 5v6c0 5.1 3.4 9.4 8 11 4.6-1.6 8-5.9 8-11V5l-8-3z" fill="currentColor"/>
      <path d="m8.3 12.2 2.6 2.6 4.8-5.3" fill="none" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="sifflet" viewBox="0 0 64 64">
      <rect x="26" y="20" width="34" height="14" rx="6" fill="currentColor"/>
      <circle cx="22" cy="38" r="16" fill="currentColor"/>
      <circle cx="22" cy="38" r="5" fill="var(--bg)"/>
    </symbol>
  </svg>

  <header class="haut">
    <h1><svg class="logo"><use href="#marmotte"/></svg>Alpage</h1>
    <div class="sifflets" id="sifflets" role="status" aria-label="Sifflets restants"></div>
    <span class="badge" id="badge-zen" hidden>zen</span>
    <div class="chrono" id="chrono" data-i18n-aria="tempsEcoule">00:00</div>
    <button class="icone" id="btn-aide" type="button" data-i18n-aria="titreAide">?</button>
    <button class="icone" id="btn-reglages" type="button" data-i18n-aria="titreReglages">⚙</button>
  </header>

  <main>
    <div id="plateau" class="plateau" role="grid" data-i18n-aria="plateau"></div>
    <div id="attente" class="attente" role="status" hidden data-i18n="attente"></div>
    <p class="aide" id="aide" data-i18n="aide"></p>
  </main>

  <nav class="actions" data-i18n-aria="parties">
    <button id="btn-jour" type="button" class="principal" data-i18n="puzzleDuJour"></button>
    <label class="taille"><span data-i18n="taille"></span>
      <select id="taille" data-i18n-aria="tailleGrille"></select>
    </label>
    <button id="btn-libre" type="button" data-i18n="nouvellePartie"></button>
  </nav>
  <p class="stats" id="stats" aria-live="polite"></p>
  <button class="prive" id="btn-prive" type="button"><svg aria-hidden="true"><use href="#bouclier"/></svg><span data-i18n="bandeau"></span></button>

  <div id="voile" class="voile" hidden>
    <div class="carte" role="dialog" aria-modal="true" aria-labelledby="voile-titre">
      <h2 id="voile-titre"></h2>
      <p id="voile-texte"></p>
      <div class="carte-actions">
        <button id="btn-voir" type="button" data-i18n="voirGrille"></button>
        <button id="btn-rejouer" type="button" data-i18n="reessayer"></button>
        <button id="btn-nouveau" type="button" class="principal" data-i18n="nouvellePartie"></button>
      </div>
    </div>
  </div>

  <div id="reglages" class="voile" hidden>
    <div class="carte" role="dialog" aria-modal="true" aria-labelledby="reglages-titre">
      <h2 id="reglages-titre" data-i18n="titreReglages"></h2>
      <label class="reglage"><input type="checkbox" id="reg-autoCroix"><span><b data-i18n="autoCroix"></b><small data-i18n="autoCroixDesc"></small></span></label>
      <label class="reglage"><input type="checkbox" id="reg-zen"><span><b data-i18n="zen"></b><small data-i18n="zenDesc"></small></span></label>
      <label class="reglage"><input type="checkbox" id="reg-motifs"><span><b data-i18n="motifs"></b><small data-i18n="motifsDesc"></small></span></label>
      <label class="reglage-langue"><b data-i18n="langue"></b><select id="reg-langue"></select></label>
      <section class="apropos" id="apropos">
        <h3><svg aria-hidden="true"><use href="#bouclier"/></svg><span data-i18n="priveTitre"></span></h3>
        <p data-i18n="priveTexte"></p>
        <a href="https://github.com/Fabrizio1305/alpage" target="_blank" rel="noopener noreferrer" data-i18n="codeSource"></a>
      </section>
      <div class="carte-actions"><button id="btn-reglages-fermer" type="button" class="principal" data-i18n="fermer"></button></div>
    </div>
  </div>

  <div id="tuto" class="voile" hidden>
    <div class="carte tuto" role="dialog" aria-modal="true" aria-labelledby="tuto-titre">
      <section class="etape">
        <svg viewBox="0 0 100 100" class="illustration" aria-hidden="true">
          <rect x="0" y="0" width="50" height="50" class="a0"/><rect x="50" y="0" width="50" height="50" class="a1"/>
          <rect x="0" y="50" width="50" height="50" class="a2"/><rect x="50" y="50" width="50" height="50" class="a3"/>
          <path d="M25 0v100M75 0v100M0 25h100M0 75h100" class="fin"/>
          <path d="M50 0v100M0 50h100" class="gros"/><rect x="1" y="1" width="98" height="98" class="gros"/>
          <use href="#marmotte" x="27.5" y="2.5" width="20" height="20"/>
          <use href="#marmotte" x="77.5" y="27.5" width="20" height="20"/>
          <use href="#marmotte" x="2.5" y="52.5" width="20" height="20"/>
          <use href="#marmotte" x="52.5" y="77.5" width="20" height="20"/>
        </svg>
        <h2 id="tuto-titre" data-i18n="tuto1Titre"></h2>
        <p data-i18n="tuto1Texte"></p>
      </section>
      <section class="etape" hidden>
        <svg viewBox="0 0 220 100" class="illustration" aria-hidden="true">
          <rect x="0" y="0" width="100" height="100" class="a4"/>
          <path d="M33 0v100M66 0v100M0 33h100M0 66h100" class="fin"/><rect x="1" y="1" width="98" height="98" class="gros"/>
          <use href="#marmotte" x="5" y="5" width="24" height="24"/><use href="#marmotte" x="38" y="38" width="24" height="24"/>
          <path d="M40 8l20 20M60 8l-20 20" class="non"/>
          <rect x="120" y="0" width="100" height="100" class="a6"/>
          <path d="M153 0v100M186 0v100M120 33h100M120 66h100" class="fin"/><rect x="121" y="1" width="98" height="98" class="gros"/>
          <use href="#marmotte" x="125" y="5" width="24" height="24"/><use href="#marmotte" x="191" y="71" width="24" height="24"/>
          <path d="M160 50l8 8 16-16" class="oui"/>
        </svg>
        <h2 data-i18n="tuto2Titre"></h2>
        <p data-i18n="tuto2Texte"></p>
      </section>
      <section class="etape" hidden>
        <svg viewBox="0 0 220 70" class="illustration" aria-hidden="true">
          <rect x="0" y="5" width="60" height="60" class="a3"/><rect x="1" y="6" width="58" height="58" class="gros"/>
          <path d="M68 35h20" class="fleche"/>
          <rect x="80" y="5" width="60" height="60" class="a3"/><rect x="81" y="6" width="58" height="58" class="gros"/>
          <path d="M98 23l24 24M122 23l-24 24" class="croix-ill"/>
          <path d="M148 35h20" class="fleche"/>
          <rect x="160" y="5" width="60" height="60" class="a3"/><rect x="161" y="6" width="58" height="58" class="gros"/>
          <use href="#marmotte" x="167" y="12" width="46" height="46"/>
        </svg>
        <h2 data-i18n="tuto3Titre"></h2>
        <p data-i18n="tuto3Texte"></p>
      </section>
      <div class="points" id="tuto-points" aria-hidden="true"></div>
      <div class="carte-actions">
        <button id="tuto-prec" type="button" data-i18n="precedent"></button>
        <button id="tuto-suiv" type="button" class="principal"></button>
      </div>
    </div>
  </div>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>

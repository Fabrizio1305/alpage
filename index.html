<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2f5d3a">
  <title>Alpage</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
  <svg class="symboles" aria-hidden="true">
    <symbol id="marmotte" viewBox="0 0 64 64">
      <ellipse cx="32" cy="43" rx="20" ry="16" fill="#8a5a2b"/>
      <ellipse cx="32" cy="47" rx="11" ry="9" fill="#c9a071"/>
      <circle cx="20" cy="14" r="5.5" fill="#8a5a2b"/><circle cx="44" cy="14" r="5.5" fill="#8a5a2b"/>
      <circle cx="20" cy="14" r="2.5" fill="#c9a071"/><circle cx="44" cy="14" r="2.5" fill="#c9a071"/>
      <circle cx="32" cy="25" r="15" fill="#8a5a2b"/>
      <ellipse cx="32" cy="31" rx="8" ry="6" fill="#c9a071"/>
      <circle cx="26" cy="23" r="2.3" fill="#1f1a14"/><circle cx="38" cy="23" r="2.3" fill="#1f1a14"/>
      <ellipse cx="32" cy="29" rx="2.6" ry="1.8" fill="#1f1a14"/>
      <rect x="29.4" y="31" width="2.3" height="4.5" rx="0.7" fill="#fff"/><rect x="32.3" y="31" width="2.3" height="4.5" rx="0.7" fill="#fff"/>
    </symbol>
    <symbol id="sifflet" viewBox="0 0 64 64">
      <rect x="26" y="20" width="34" height="14" rx="6" fill="currentColor"/>
      <circle cx="22" cy="38" r="16" fill="currentColor"/>
      <circle cx="22" cy="38" r="5" fill="var(--bg)"/>
    </symbol>
  </svg>

  <header class="haut">
    <h1>Alpage</h1>
    <div class="sifflets" id="sifflets" role="status" aria-label="Sifflets restants"></div>
    <div class="chrono" id="chrono" aria-label="Temps écoulé">00:00</div>
  </header>

  <main>
    <div id="plateau" class="plateau" role="grid" aria-label="Plateau de jeu"></div>
    <p class="aide" id="aide">Une marmotte par alpage, par ligne et par colonne, jamais deux qui se touchent. Touchez une case : croix, puis marmotte, puis vide.</p>
  </main>

  <nav class="actions" aria-label="Parties">
    <button id="btn-jour" type="button">Puzzle du jour</button>
    <label class="taille">Taille
      <select id="taille" aria-label="Taille de la grille"></select>
    </label>
    <button id="btn-libre" type="button">Nouvelle partie</button>
  </nav>
  <p class="stats" id="stats" aria-live="polite"></p>

  <div id="voile" class="voile" hidden>
    <div class="carte" role="dialog" aria-modal="true" aria-labelledby="voile-titre">
      <h2 id="voile-titre"></h2>
      <p id="voile-texte"></p>
      <div class="carte-actions">
        <button id="btn-rejouer" type="button">Réessayer</button>
        <button id="btn-nouveau" type="button">Nouvelle partie</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
